<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" width="190" height="44">
  <defs>
    <linearGradient id="logo-bg-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="logo-plane-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Cute Mascot Mark (34x34) -->
  <g transform="translate(2, 5)">
    <!-- Rounded App Icon Squircle -->
    <rect x="0" y="0" width="34" height="34" rx="10" fill="url(#logo-bg-sky)"/>
    <rect x="0.5" y="0.5" width="33" height="33" rx="9.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Cute Smiling Bookmark Character -->
    <path d="M10 6C10 5.2 10.7 4.5 11.5 4.5H20.5C21.3 4.5 22 5.2 22 6V26L16 21.5L10 26V6Z" fill="#FFFFFF"/>
    
    <!-- Top Bookmark Accent -->
    <path d="M10 6C10 5.2 10.7 4.5 11.5 4.5H20.5C21.3 4.5 22 5.2 22 6V8H10V6Z" fill="#E0F2FE"/>

    <!-- Happy Eyes (⌒ ⌒) -->
    <path d="M12.2 13C12.2 11.8 13.8 11.8 13.8 13" stroke="#0284C7" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M18.2 13C18.2 11.8 19.8 11.8 19.8 13" stroke="#0284C7" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Rosy Cheeks -->
    <circle cx="11.5" cy="15.8" r="1.3" fill="#FDA4AF"/>
    <circle cx="20.5" cy="15.8" r="1.3" fill="#FDA4AF"/>

    <!-- Gentle Smile -->
    <path d="M15 15.5C15.3 16.8 16.7 16.8 17 15.5" stroke="#0284C7" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Little Paper Airplane Fluttering -->
    <g transform="translate(19, 3) rotate(12)">
      <path d="M0 4.5L8 0L4.5 8L3.8 5.2L0 4.5Z" fill="url(#logo-plane-gold)"/>
    </g>
  </g>

  <!-- Friendly Typography -->
  <!-- Main Name: たびしお -->
  <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" letter-spacing="0.08em">たびしお</text>

  <!-- Tagline / Sub-concept: TABISHIO · 旅のしおり -->
  <text x="47" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#7DD3FC" letter-spacing="0.18em">TABISHIO · 旅のしおり</text>
</svg>
