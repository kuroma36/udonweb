<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Friendly Sky & Ocean Gradient -->
    <linearGradient id="bg-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <!-- Soft Golden Accent -->
    <linearGradient id="plane-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0369A1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Friendly App Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#bg-sky)" filter="url(#icon-shadow)"/>
  <rect x="2.5" y="2.5" width="43" height="43" rx="12.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

  <!-- Cute Smiling Bookmark Character (たびしお しおりくん) -->
  <!-- Main Bookmark Body: Clean white ribbon with bottom notch -->
  <path d="M14 9C14 7.9 14.9 7 16 7H28C29.1 7 30 7.9 30 9V35L22 29L14 35V9Z" fill="#FFFFFF"/>
  
  <!-- Friendly Bookmark Top Strap / Border -->
  <path d="M14 9C14 7.9 14.9 7 16 7H28C29.1 7 30 7.9 30 9V12H14V9Z" fill="#E0F2FE"/>

  <!-- Adorable Cheerful Face: Smiling Happy Eyes (⌒ ⌒) -->
  <path d="M17 18C17 16.5 19 16.5 19 18" stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M25 18C25 16.5 27 16.5 27 18" stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cute Cheeks (Blush) -->
  <circle cx="16" cy="21.5" r="1.8" fill="#FDA4AF"/>
  <circle cx="28" cy="21.5" r="1.8" fill="#FDA4AF"/>

  <!-- Gentle Happy Smile (‿) -->
  <path d="M20.5 21C21 22.8 23 22.8 23.5 21" stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Tiny Cheerful Paper Airplane taking off from Bookmark -->
  <g transform="translate(26, 6) rotate(15)">
    <!-- Paper Airplane Fold -->
    <path d="M0 6L11 0L6 11L5 7L0 6Z" fill="url(#plane-gold)"/>
    <path d="M6 11L5 7L11 0L6 11Z" fill="#D97706" opacity="0.4"/>
  </g>

  <!-- Friendly Sparkle Dots -->
  <circle cx="9" cy="15" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="37" cy="31" r="1.2" fill="#FDE047" opacity="0.9"/>
</svg>
