{% extends 'travel/base.html' %}
{% load static %}

{% block title %}本登録完了 - たびしお (TABISHIO){% endblock %}

{% block content %}
<div style="padding: 3rem 1rem 5rem; max-width: 480px; margin: 0 auto; width: 100%;">

  <div style="background: #FFFFFF; border-radius: var(--radius-xl); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border-light); text-align: center;">

    <!-- Success Badge -->
    <div style="
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: #ECFDF5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    ">
      🎉
    </div>

    <div style="display: inline-block; background: #DCFCE7; color: #15803D; padding: 0.25rem 0.85rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; margin-bottom: 0.75rem;">
      メール認証が完了しました
    </div>

    <h1 style="font-size: 1.7rem; font-weight: 900; letter-spacing: -0.02em; color: var(--text-main); margin: 0 0 1rem;">
      ようこそ、たびしおへ！
    </h1>

    <p style="font-size: 0.95rem; color: #334155; line-height: 1.7; margin-bottom: 2rem;">
      アカウントの本登録が正常に完了しました。<br>
      早速、新しい旅行の計画やしおりの作成を始めましょう！
    </p>

    <a href="{% url 'travel:trip_list' %}" class="btn-travel-new" style="width: 100%; justify-content: center; padding: 0.9rem; font-size: 1rem; font-weight: 700; border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; text-decoration: none;">
      <span>🚀 旅の一覧へ進む</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>

  </div>

</div>
{% endblock %}
