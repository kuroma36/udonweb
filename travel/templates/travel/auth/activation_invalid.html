{% extends 'travel/base.html' %}
{% load static %}

{% block title %}認証エラー - たびしお (TABISHIO){% endblock %}

{% block content %}
<div style="padding: 3rem 1rem 5rem; max-width: 480px; margin: 0 auto; width: 100%;">

  <div style="background: #FFFFFF; border-radius: var(--radius-xl); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border-light); text-align: center;">

    <!-- Error Icon -->
    <div style="
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: #FEF2F2;
      color: #DC2626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    ">
      ⚠️
    </div>

    <div style="display: inline-block; background: #FEE2E2; color: #B91C1C; padding: 0.25rem 0.85rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; margin-bottom: 0.75rem;">
      リンクが無効または期限切れです
    </div>

    <h1 style="font-size: 1.55rem; font-weight: 900; letter-spacing: -0.02em; color: var(--text-main); margin: 0 0 1rem;">
      本登録を完了できませんでした
    </h1>

    <p style="font-size: 0.9rem; color: #475569; line-height: 1.7; margin-bottom: 2rem;">
      アクセスされた確認リンクは、有効期限が切れているか、すでに使用済みの可能性があります。<br>
      お手数ですが、以下のボタンから認証メールを再送してください。
    </p>

    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
      <a href="{% url 'travel:resend_activation' %}" class="btn-travel-new" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 0.95rem; font-weight: 700; border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; text-decoration: none;">
        <span>✉️ 認証メールを再送する</span>
      </a>
      <a href="{% url 'travel:login' %}" class="btn-action-outline" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.9rem; box-sizing: border-box; text-decoration: none;">
        ログイン画面へ戻る
      </a>
    </div>

  </div>

</div>
{% endblock %}
